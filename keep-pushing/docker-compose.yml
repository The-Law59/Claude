services:
  keep-pushing:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Clé lue depuis le fichier .env à côté de ce fichier (jamais commité).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMINS: ${ADMINS:-}
    volumes:
      - translations:/app/data
    restart: unless-stopped
volumes:
  translations:
