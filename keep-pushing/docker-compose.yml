services:
  keep-pushing:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Clé lue depuis le fichier .env à côté de ce fichier (jamais commité).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMINS: ${ADMINS:-}
    volumes:
      - translations:/app/data
    restart: unless-stopped
  # Surveillance (optionnelle) : docker compose --profile monitoring up -d
  # puis http://<IP du conteneur>:3001 pour créer l'alerte sur /api/health.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    ports:
      - "3001:3001"
    volumes:
      - uptime:/app/data
    restart: unless-stopped
volumes:
  translations:
  uptime:
