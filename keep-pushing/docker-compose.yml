services:
  keep-pushing:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Clé lue depuis le fichier .env à côté de ce fichier (jamais commité).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMINS: ${ADMINS:-}
      # IP de Nginx Proxy Manager (IP réelle des visiteurs, limites par IP).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Résultats des essais libres (fournisseur sous licence, voir deploy/README.md).
      # Données F1 par Hyprace (RapidAPI, plan Pro) ; sans clé : Jolpica.
      HYPRACE_API_KEY: ${HYPRACE_API_KEY:-}
      # Pages légales (App Store) : éditeur et adresse de contact affichés.
      PUBLISHER_NAME: ${PUBLISHER_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      PRACTICE_PROVIDER: ${PRACTICE_PROVIDER:-}
      PRACTICE_API_KEY: ${PRACTICE_API_KEY:-}
      # Jeu Mercato : année de la grille à deviner (2028 par défaut).
      MERCATO_YEAR: ${MERCATO_YEAR:-}
      # Joker regagné avec les pubs (1 pour activer, une fois l'appli sur les stores).
      ADS_ENABLED: ${ADS_ENABLED:-}
    volumes:
      - translations:/app/data
    restart: unless-stopped
  # Surveillance (optionnelle) : docker compose --profile monitoring up -d
  # puis http://<IP du conteneur>:3001 pour créer l'alerte sur /api/health.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    ports:
      - "3001:3001"
    volumes:
      - uptime:/app/data
    restart: unless-stopped
volumes:
  translations:
  uptime:
